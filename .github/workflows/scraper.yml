name: University Auto Scraper

on:
  schedule:
    - cron: '0 * * * *' # هذا الأمر يعني: اشتغل كل ساعة بالضبط
  workflow_dispatch: # هذا يسمحلك تشغله يدوياً للتجربة بأي وقت

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
    - name: سحب الكود من المستودع
      uses: actions/checkout@v4

    - name: تنصيب بيئة بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: تنصيب المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        # إذا تستخدم مكتبات ثانية بالبايثون اكتبها هنا

    - name: تشغيل سكريبت الأخبار
      env:
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: python backend/news_scraper.py

    - name: تشغيل سكريبت النشاطات
      env:
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: python backend/activities_scraper.py